name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --release --workspace --all-features --all-targets -- -D warnings

      - name: Check
        run: cargo check --release --workspace --all-targets

      - name: Test
        run: cargo test --release --workspace -- --quiet

      - name: Run Rust & CLI examples
        if: matrix.os != 'windows-latest'
        run: |
          cargo build --release --bin mkd-freeport
          cargo run --release --example basic_discovery
          cargo run --release --example custom_range
          cargo run --release --example reserve_udp
          MKD_FREEPORT="$(pwd)/target/release/mkd-freeport" ./examples/cli/run-all.sh

      - name: Generate man page & completions
        run: cargo run --release -p xtask -- dist-assets --out-dir dist/assets

      - name: Lint man page (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! command -v groff >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y groff
          fi
          groff -man -Tutf8 -ww dist/assets/man/mkd-freeport.1 >/dev/null
