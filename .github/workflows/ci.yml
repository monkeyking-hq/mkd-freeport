name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy-check-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: SSH host alias github.com-mkd → github.com
        env:
          MKD_GITHUB_SSH_USER: monkeykingdev-ops
        run: bash scripts/ci-ssh-github-alias.sh

      - name: Install MKD deploy SSH key
        env:
          MKD_GITHUB_SSH_PRIVATE_KEY: ${{ secrets.MKD_GITHUB_SSH_PRIVATE_KEY }}
        run: bash scripts/ci-install-ssh-deploy-key.sh

      - name: Strip local path patches (use git deps from Cargo.lock)
        run: python3 scripts/ci-strip-cargo-patches.py

      - name: Cargo git-fetch-with-cli (honors ~/.ssh/config alias)
        run: |
          mkdir -p .cargo
          printf '%s\n' '[net]' 'git-fetch-with-cli = true' >> .cargo/config.toml

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Cargo test
        run: cargo test --workspace -- --quiet