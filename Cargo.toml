[package]
name = "mkd-freeport"
version = "0.3.1"
edition = "2021"
description = "Discover and reserve TCP/UDP ports over IPv4 and IPv6 for scripts and AI agents"
license = "MIT"
repository = "https://github.com/monkeyking-hq/mkd-freeport"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rand = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
signal-hook-registry = "1.4"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]

