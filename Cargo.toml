[package]
name = "mkd-freeport"
version = "0.2.1"
edition = "2021"
description = "Find available free TCP ports for scripts and AI agents"
license = "MIT"
repository = "http://stonemonkey:37373/MonkeyKing.dev/mkd-freeport"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1

